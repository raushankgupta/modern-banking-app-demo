server.port=${SERVER_PORT:8080}
spring.application.name=modern-banking-backend

# Modern SQLite database (created by modern/database/init.sh). Never the legacy legacybank.db.
bank.db.path=${BANK_DB_PATH:../database/data/modernbank.db}

# Origins allowed to call the API (Vite dev server by default).
bank.cors.allowed-origins=${BANK_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Health endpoint: /actuator/health (includes a database check)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT (HS256). Set BANK_JWT_SECRET (>= 32 bytes) for anything beyond local demo use.
# The default below is a DEV-ONLY value so the app starts without setup. Never use it in production.
bank.jwt.secret=${BANK_JWT_SECRET:dev-only-insecure-jwt-key-change-me-0123456789}
bank.jwt.expiry-minutes=${BANK_JWT_EXPIRY_MINUTES:60}
